[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easytowing"
version = "0.1.0"
description = "Engineering core for multi-axle trailer steering design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",
    "pypdf>=5.0",
    "Pillow>=10.0",
]

[project.scripts]
easytowing-worker = "easytowing.worker:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["easytowing*"]

[tool.setuptools.package-data]
"easytowing" = ["web/*.html", "web/*.css", "web/*.js", "postgres_schema.sql"]
